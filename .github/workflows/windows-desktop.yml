name: Build Windows desktop preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'traceproof/**'
      - 'desktop_launcher.py'
      - 'pyproject.toml'
      - '.github/workflows/windows-desktop.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app, image support and packager
        run: python -m pip install -e ".[images,signing]" pyinstaller
      - name: Run unit tests
        run: python -m unittest discover -s tests -q
      - name: Package standalone launcher
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name TraceProof --add-data "traceproof/static;traceproof/static" desktop_launcher.py
      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/TraceProof.exe")) { throw "Desktop executable missing" }
          Get-Item "dist/TraceProof.exe" | Select-Object Name, Length
      - name: Smoke-test packaged executable over localhost
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "traceproof-out.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "traceproof-err.txt"
          $exe = (Resolve-Path "dist/TraceProof.exe").Path
          $proc = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i = 0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 1
              $proc.Refresh()
              if ($proc.HasExited) {
                throw "The desktop executable exited unexpectedly (exit code $($proc.ExitCode))"
              }
              if (Test-Path $stdout) {
                $log = Get-Content $stdout -Raw
                if ($log -match 'http://127\.0\.0\.1:\d+/') {
                  $url = $Matches[0]
                  try {
                    $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 3
                    if ($response.StatusCode -eq 200 -and $response.Content -match "TraceProof") {
                      $video = Invoke-WebRequest -Uri ($url + "video") -UseBasicParsing -TimeoutSec 3
                      if ($video.StatusCode -eq 200 -and $video.Content -match "Video") {
                        $ready = $true
                        Write-Host "Smoke test passed: $url and video UI reachable"
                        break
                      }
                    }
                  } catch {
                    Write-Host "Waiting for local HTTP service..."
                  }
                }
              }
            }
            if (-not $ready) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw "The packaged app did not serve its local UI in time"
            }
          } finally {
            $proc.Refresh()
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - name: Publish download artifact
        uses: actions/upload-artifact@v4
        with:
          name: TraceProof-Windows-Preview
          path: dist/TraceProof.exe
          if-no-files-found: error
          retention-days: 30