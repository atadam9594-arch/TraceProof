name: Build Windows desktop preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'traceproof/**'
      - 'desktop_launcher.py'
      - 'pyproject.toml'
      - '.github/workflows/windows-desktop.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app, image support and packager
        run: python -m pip install -e ".[images,signing]" pyinstaller
      - name: Run unit tests
        run: python -m unittest discover -s tests -q
      - name: Package standalone launcher
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name TraceProof --add-data "traceproof/static;traceproof/static" desktop_launcher.py
      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/TraceProof.exe")) { throw "Desktop executable missing" }
          Get-Item "dist/TraceProof.exe" | Select-Object Name, Length
      - name: Smoke-test packaged executable over localhost
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "traceproof-out.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "traceproof-err.txt"
          $exe = (Resolve-Path "dist/TraceProof.exe").Path
          $proc = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i = 0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 1
              $proc.Refresh()
              if ($proc.HasExited) {
                throw "The desktop executable exited unexpectedly (exit code $($proc.ExitCode))"
              }
              if (Test-Path $stdout) {
                $log = Get-Content $stdout -Raw
                if ($log -match 'http://127\.0\.0\.1:\d+/') {
                  $url = $Matches[0]
                  try {
                    $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 3
                    if ($response.StatusCode -eq 200 -and $response.Content -match "TraceProof") {
                      $video = Invoke-WebRequest -Uri ($url + "video") -UseBasicParsing -TimeoutSec 3
                      $script = Invoke-WebRequest -Uri ($url + "video.js") -UseBasicParsing -TimeoutSec 3
                      $style = Invoke-WebRequest -Uri ($url + "video.css") -UseBasicParsing -TimeoutSec 3
                      $capabilities = Invoke-RestMethod -Uri ($url + "api/video/capabilities") -TimeoutSec 3
                      $bench = Invoke-WebRequest -Uri ($url + "benchmark") -UseBasicParsing -TimeoutSec 3
                      $benchScript = Invoke-WebRequest -Uri ($url + "benchmark.js") -UseBasicParsing -TimeoutSec 3
                      $benchStyle = Invoke-WebRequest -Uri ($url + "benchmark.css") -UseBasicParsing -TimeoutSec 3
                      $setup = Invoke-WebRequest -Uri ($url + "setup") -UseBasicParsing -TimeoutSec 3
                      $setupScript = Invoke-WebRequest -Uri ($url + "setup.js") -UseBasicParsing -TimeoutSec 3
                      $setupStyle = Invoke-WebRequest -Uri ($url + "setup.css") -UseBasicParsing -TimeoutSec 3
                      $diagnostics = Invoke-RestMethod -Uri ($url + "api/system") -TimeoutSec 12
                      $network = Invoke-WebRequest -Uri ($url + "network") -UseBasicParsing -TimeoutSec 3
                      $networkScript = Invoke-WebRequest -Uri ($url + "network.js") -UseBasicParsing -TimeoutSec 3
                      $networkStyle = Invoke-WebRequest -Uri ($url + "network.css") -UseBasicParsing -TimeoutSec 3
                      if ($network.StatusCode -eq 200 -and $network.Content -match "Video relationship network" -and
                          $networkScript.StatusCode -eq 200 -and $networkScript.Content -match "traceproof.video.network.v1" -and
                          $networkStyle.StatusCode -eq 200 -and
                          $setup.StatusCode -eq 200 -and $setup.Content -match "Prepare your video tools" -and
                          $setupScript.StatusCode -eq 200 -and $setupScript.Content -match "diagnostics" -and
                          $setupStyle.StatusCode -eq 200 -and $diagnostics.schema -eq "traceproof.diagnostics.v1" -and
                          $video.StatusCode -eq 200 -and $video.Content -match "Video" -and
                          $bench.StatusCode -eq 200 -and $bench.Content -match "Benchmark Lab" -and
                          $benchScript.StatusCode -eq 200 -and $benchScript.Content -match "confidence_intervals_95" -and
                          $benchStyle.StatusCode -eq 200 -and
                          $script.StatusCode -eq 200 -and $script.Content -match "api/video/chunk" -and
                          $style.StatusCode -eq 200 -and $capabilities.max_file_bytes -eq 250000000) {
                        $ready = $true
                        Write-Host "Smoke test passed: $url and video UI reachable"
                        break
                      }
                    }
                  } catch {
                    Write-Host "Waiting for local HTTP service..."
                  }
                }
              }
            }
            if (-not $ready) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw "The packaged app did not serve its local UI in time"
            }
          } finally {
            $proc.Refresh()
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - name: Smoke-test packaged offline CLI commands
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/TraceProof.exe").Path
          & $exe video-network --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Packaged video-network command failed" }
          & $exe ffmpeg-register --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Packaged ffmpeg-register command failed" }
          $doctor = & $exe doctor --json
          if ($LASTEXITCODE -ne 0 -or -not (($doctor -join "`n") -match "traceproof.diagnostics.v1")) { throw "Packaged doctor command failed" }
      - name: Publish download artifact
        uses: actions/upload-artifact@v4
        with:
          name: TraceProof-Windows-Preview
          path: dist/TraceProof.exe
          if-no-files-found: error
          retention-days: 30

  release-preview:
    name: Publish public Windows pre-release
    if: github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: traceproof-v0.14.0-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TraceProof-Windows-Preview
          path: release
      - name: Publish versioned preview with SHA-256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s release/TraceProof.exe
          (cd release && sha256sum TraceProof.exe > TraceProof.exe.sha256)
          if gh release view v0.14.0 >/dev/null 2>&1; then
            echo "v0.14.0 already published; not replacing released assets"
            exit 0
          fi
          {
            echo '# TraceProof v0.14.0 — Windows preview'
            echo 'Unsigned early-access build. The packaged app was smoke-tested over localhost before release.'
            echo 'Unzip TraceProof.exe and run it. Closing its console stops the app.'
            echo 'Windows SmartScreen may warn because the executable is not code signed.'
            echo 'FFmpeg and ffprobe are not included and are needed for video analysis.'
            echo 'Video Lab supports up to 250 MB per file in temporary 1 MiB localhost chunks; cancel may wait for decoding to finish.'
            echo 'New multilingual Benchmark Lab: evaluate labeled video overlaps, group errors and Wilson confidence intervals.'
            echo 'The dashboard reads JSON locally; no dataset is sent to the cloud.'
            echo 'Video fingerprint caching avoids repeated decoding of the same clip within a benchmark.'
            echo 'New multilingual Setup Lab performs local FFmpeg, ffprobe and Pillow diagnostics, but never downloads programs.'
            echo 'Dataset Audit checks SHA-256, curator rights assertions and benchmark pair coverage; it does not independently verify licenses.'
            echo 'New Video Network: up to 12 local videos; offline HTML/SVG and multilingual network.json viewer.'
            echo 'Windows EXE now supports CLI commands, including per-user ffmpeg-register and ffmpeg-forget; FFmpeg is NOT bundled.'
            echo 'Synthetic FFmpeg regressions and 169 unit/integration tests are not representative real-world calibration.'
            echo 'A SHA-256 checksum is included. Similarity does not prove authenticity or AI authorship.'
          } > release-notes.md
          gh release create v0.14.0 release/TraceProof.exe release/TraceProof.exe.sha256 --target "$GITHUB_SHA" --title "TraceProof v0.14.0 (preview)" --prerelease --notes-file release-notes.md
