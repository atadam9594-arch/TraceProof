name: Verify ProofGraph
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and optional image/signing dependencies
        run: python -m pip install -e '.[images,signing]'
      - name: Run all unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Verify browser script syntax
        run: |
          node --check traceproof/static/app.js
          node --check traceproof/static/video.js
          node --check traceproof/static/benchmark.js
          node --check traceproof/static/setup.js
      - name: FFmpeg and real local-video regression scenarios
        if: matrix.python-version == '3.12'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python scripts/video_regression.py
          python scripts/upload_regression.py
          python scripts/benchmark_regression.py
          python scripts/dataset_audit_regression.py
