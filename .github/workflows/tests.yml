name: Verify ProofGraph
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[images,signing]'
      - run: python -m unittest discover -s tests -v
      - name: Web assets syntax
        run: |
          node --check traceproof/static/app.js
          node --check traceproof/static/video.js
      - name: FFmpeg synthetic regression scenarios (Python 3.12)
        if: matrix.python-version == '3.12'
        run: |
          ffmpeg -version
          ffprobe -version
          python scripts/video_regression.py
